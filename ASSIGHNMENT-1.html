<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./ASSIGHNMENT-1.css">
</head>
<body>
    <div class="dashboard">
      <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="#">Home</a>
      </br>
        <a href="#">Analytics</a>
        </br>
        <a href="#">Users</a>
        </br>
        <a href="#">Settings</a>
      </div>

      <div class="header">
        <input type="text" placeholder="Search..." class="search" />
        <div class="profile">
          <span>Admin</span>
        </div>
      </div>

      <div class="main">
        <div class="cards">
          <div class="card">Users: 1200</div>
          <div class="card">Revenue: ₹45,000</div>
          <div class="card">Orders: 320</div>
          <div class="card">Growth: +12%</div>
        </div>

        <div class="grid-section">
          <div class="chart">📊 Chart Area</div>
          <img src="bar-chart.png" alt="Bar Chart"
          width="300" height="100">
          <div class="activity">📋 Recent Activity</div>
          <div class="notifications">🔔 Notifications</div>
          
        </div>

        <div class="table-container">
          <h3>User Data</h3>
          <table>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Status</th>
            </tr>
            <tr>
              <td>John</td>
              <td>john@mail.com</td>
              <td>Active</td>
            </tr>
            <tr>
              <td>Sarah</td>
              <td>sarah@mail.com</td>
              <td>Inactive</td>
            </tr>
             <tr>
              <td>Nitya</td>
              <td>nitya@mail.com</td>
              <td>Active</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>

</html>
